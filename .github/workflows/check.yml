name: Validate static Logic site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node scripts/validate-data.mjs
      - run: node scripts/validate-site.mjs
